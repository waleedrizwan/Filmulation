name: FilmulationiOS
options:
  bundleIdPrefix: com.waleedrizwan
  deploymentTarget:
    iOS: "17.0"
packages:
  FilmulationCore:
    path: ../core
targets:
  Filmulation:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: FilmulationCore
        product: FilmulationCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waleedrizwan.filmulation
        PRODUCT_NAME: Filmulation
        DEVELOPMENT_TEAM: CCY6PYVHZW
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Filmulation
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Filmulation saves your finished photos to your library."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
